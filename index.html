<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Kid Storybook Creator</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6366f1;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .form-section {
            background: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
            font-size: 1.1em;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #6366f1;
        }

        .storybook {
            margin-top: 30px;
            perspective: 1500px;
        }

        .book-container {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 0 auto;
            transform-style: preserve-3d;
        }

        .book-spine {
            position: absolute;
            left: -15px;
            top: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(to bottom, #8b4513, #654321);
            border-radius: 5px 0 0 5px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
        }

        .book-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 0 15px 15px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.6s ease;
            transform-origin: left center;
            backface-visibility: hidden;
        }

        .book-cover.opened {
            transform: rotateY(-180deg);
        }

        .book-pages {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fefefe;
            border-radius: 0 15px 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
        }

        .book-pages.active {
            display: block;
        }

        .page-content {
            display: flex;
            height: 100%;
            position: relative;
        }

        .page-left, .page-right {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .page-left {
            border-right: 2px solid #e2e8f0;
        }

        .page-text {
            font-size: 20px;
            line-height: 1.8;
            color: #374151;
            text-align: center;
            margin-bottom: 20px;
        }

        .page-image {
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-image img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
            object-fit: contain;
        }

        .page-number {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #6366f1;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .navigation {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .nav-button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .page-turn-animation {
            animation: pageTurn 0.6s ease-in-out;
        }

        @keyframes pageTurn {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(-90deg); }
            100% { transform: rotateY(0deg); }
        }

        .error {
            color: #ef4444;
            background: #fef2f2;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #fecaca;
            margin: 15px 0;
        }

        .retry-button {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .error-actions {
            margin-top: 15px;
            text-align: center;
        }

        .story-title {
            text-align: center;
            color: #6366f1;
            font-size: 2.2em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .create-another {
            text-align: center;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .book-container {
                width: 90vw;
                height: 70vh;
                max-width: 600px;
                max-height: 450px;
            }

            .page-content {
                flex-direction: column;
            }

            .page-left {
                border-right: none;
                border-bottom: 2px solid #e2e8f0;
                flex: 0.4;
            }

            .page-right {
                flex: 0.6;
            }

            .page-text {
                font-size: 16px;
            }

            .book-cover {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Magical Storybook Creator 🌟</h1>
        
        <div class="form-section" id="storyForm">
            <div class="form-group">
                <label for="pages">Number of Pages (3-10):</label>
                <select id="pages">
                    <option value="3">3 Pages</option>
                    <option value="4">4 Pages</option>
                    <option value="5" selected>5 Pages</option>
                    <option value="6">6 Pages</option>
                    <option value="7">7 Pages</option>
                    <option value="8">8 Pages</option>
                    <option value="9">9 Pages</option>
                    <option value="10">10 Pages</option>
                </select>
            </div>

            <div class="form-group">
                <label for="storyTopic">What should the story be about?</label>
                <textarea id="storyTopic" placeholder="e.g., A brave little mouse who wants to become a knight, or a magical garden where vegetables come to life..."></textarea>
            </div>

            <div class="form-group">
                <label for="mainCharacters">Main Characters (optional):</label>
                <input type="text" id="mainCharacters" placeholder="e.g., Luna the rabbit, Captain Whiskers...">
            </div>

            <div class="form-group">
                <label for="sideCharacters">Side Characters (optional):</label>
                <input type="text" id="sideCharacters" placeholder="e.g., Old Oak Tree, Sparkle the fairy...">
            </div>

            <button onclick="generateStory()">✨ Create My Story! ✨</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            <div id="loadingText">🌟 Creating your magical story...</div>
            <div style="margin-top: 10px; font-size: 14px;" id="loadingSubtext">This may take a few moments while we generate text and illustrations!</div>
            <div style="margin-top: 10px; font-size: 12px; color: #6b7280;" id="retryCount"></div>
        </div>

        <div id="errorDiv" class="error" style="display: none;">
            <div id="errorMessage"></div>
            <div class="error-actions">
                <button class="retry-button" onclick="retryGeneration()">🔄 Try Again</button>
                <button class="retry-button" onclick="resetForm()">🏠 Start Over</button>
            </div>
        </div>

        <div id="storybook" class="storybook"></div>
    </div>

    <script>
        let storyData = {
            pages: [],
            topic: '',
            mainCharacters: '',
            sideCharacters: '',
            totalPages: 0,
            characterDescriptions: {} 
        };

        let currentPage = 0;
        let bookOpened = false;
        let currentGenerationStep = null;
        let generationRetryCount = 0;
        const MAX_RETRIES = 3;

        async function retryWithBackoff(fn, maxRetries = MAX_RETRIES, stepName = 'operation') {
            let lastError;
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    updateRetryCount(stepName, attempt, maxRetries);
                    const result = await fn();
                    return result;
                } catch (error) {
                    lastError = error;
                    console.error(`Attempt ${attempt} failed for ${stepName}:`, error);
                    
                    if (attempt < maxRetries) {
                        const delay = Math.min(1000 * Math.pow(2, attempt - 1), 5000); 
                        updateLoadingText(`⏳ Retrying ${stepName}... (attempt ${attempt + 1}/${maxRetries})`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            
            throw new Error(`${stepName} failed after ${maxRetries} attempts: ${lastError.message}`);
        }

        function updateRetryCount(stepName, attempt, maxRetries) {
            const retryElement = document.getElementById('retryCount');
            if (attempt > 1) {
                retryElement.textContent = `Retry ${attempt - 1}/${maxRetries - 1} for ${stepName}`;
            } else {
                retryElement.textContent = '';
            }
        }

        async function generateStory() {
            const pages = parseInt(document.getElementById('pages').value);
            const topic = document.getElementById('storyTopic').value.trim();
            const mainCharacters = document.getElementById('mainCharacters').value.trim();
            const sideCharacters = document.getElementById('sideCharacters').value.trim();

            if (!topic) {
                showError('Please tell us what your story should be about!', false);
                return;
            }

            storyData = {
                pages: [],
                topic,
                mainCharacters,
                sideCharacters,
                totalPages: pages,
                characterDescriptions: {}
            };

            generationRetryCount = 0;
            currentGenerationStep = 'full_generation';

            try {
                await executeGeneration();
            } catch (error) {
                console.error('Story generation failed:', error);
                showError(`Story creation failed: ${error.message}`, true);
            }
        }

        async function executeGeneration() {
            document.getElementById('storyForm').style.display = 'none';
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('errorDiv').style.display = 'none';

            try {
                updateLoadingText('🌟 Creating your story text...');
                await retryWithBackoff(generateStoryText, MAX_RETRIES, 'story text generation');
                
                updateLoadingText('🎨 Designing character appearances...');
                await retryWithBackoff(generateCharacterDescriptions, MAX_RETRIES, 'character design');
                
                updateLoadingText('📸 Creating character reference images...');
                await retryWithBackoff(generateCharacterImages, MAX_RETRIES, 'character images');
                
                updateLoadingText('🔍 Analyzing character appearances...');
                await retryWithBackoff(analyzeCharacterImages, MAX_RETRIES, 'character analysis');
                
                updateLoadingText('🖼️ Creating story illustrations...');
                await retryWithBackoff(generateStoryImages, MAX_RETRIES, 'story illustrations');

                displayStorybook();

            } catch (error) {
                throw error;
            }
        }

        async function retryGeneration() {
            generationRetryCount++;
            updateLoadingText(`🔄 Retrying story creation (attempt ${generationRetryCount + 1})...`);
            
            try {
                await executeGeneration();
            } catch (error) {
                console.error('Retry failed:', error);
                showError(`Retry failed: ${error.message}`, true);
            }
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        async function generateStoryText() {
            const systemPrompt = `You are a creative children's story writer. Create an engaging, age-appropriate story for kids aged 4-8. 
            
            The story should be split into exactly ${storyData.totalPages} pages with clear, simple text suitable for young children.
            
            Story requirements:
            - Topic: ${storyData.topic}
            ${storyData.mainCharacters ? `- Main characters: ${storyData.mainCharacters}` : ''}
            ${storyData.sideCharacters ? `- Side characters: ${storyData.sideCharacters}` : ''}
            - Each page should have 1-3 sentences
            - Use simple, engaging language
            - Include a clear beginning, middle, and end
            - Make it positive and inspiring
            
            Respond with JSON in this exact format:
            {
              "title": "Story Title",
              "pages": [
                {
                  "pageNumber": 1,
                  "text": "Page 1 text here"
                },
                {
                  "pageNumber": 2,
                  "text": "Page 2 text here"
                }
              ]
            }`;

            try {
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: systemPrompt
                        },
                        {
                            role: "user",
                            content: "Please create my story!"
                        }
                    ],
                    json: true
                });

                const result = JSON.parse(completion.content);
                
                if (!result.title || !result.pages || !Array.isArray(result.pages)) {
                    throw new Error('Invalid story format received from AI');
                }
                
                storyData.title = result.title;
                storyData.pages = result.pages;
                
            } catch (error) {
                if (error.message.includes('JSON')) {
                    throw new Error('Failed to parse story content');
                }
                throw new Error(`Story text generation failed: ${error.message}`);
            }
        }

        async function generateCharacterDescriptions() {
            try {
                let allCharacters = [];
                
                if (storyData.mainCharacters) {
                    allCharacters.push(...storyData.mainCharacters.split(',').map(c => c.trim()));
                }
                if (storyData.sideCharacters) {
                    allCharacters.push(...storyData.sideCharacters.split(',').map(c => c.trim()));
                }

                const storyText = storyData.pages.map(p => p.text).join(' ');
                
                const characterExtractionPrompt = `Extract all character names from this children's story text and the provided character lists. Return them as a simple comma-separated list of character names only.

Story text: ${storyText}
Main characters provided: ${storyData.mainCharacters || 'none'}
Side characters provided: ${storyData.sideCharacters || 'none'}

Return format: Character1, Character2, Character3`;

                const extractionCompletion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "user",
                            content: characterExtractionPrompt
                        }
                    ]
                });

                const extractedCharacters = extractionCompletion.content.split(',').map(c => c.trim()).filter(c => c.length > 0);
                allCharacters.push(...extractedCharacters);
                
                allCharacters = [...new Set(allCharacters)].filter(char => char && char.length > 0);

                for (const character of allCharacters) {
                    const descriptionPrompt = `Create a detailed visual description for a children's book character named "${character}" for the story about: ${storyData.topic}

The description should be detailed enough to generate consistent artwork. Include:
- Physical appearance (size, shape, colors)
- Clothing or distinctive features
- Art style (should be child-friendly, cartoon-like)
- Any accessories or props they might have

Keep it appropriate for children aged 4-8. Make it colorful and appealing.

Respond with just the visual description, no other text.`;

                    const descriptionCompletion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "user",
                                content: descriptionPrompt
                            }
                        ]
                    });

                    if (!storyData.characterDescriptions[character]) {
                        storyData.characterDescriptions[character] = {};
                    }
                    storyData.characterDescriptions[character].initialDescription = descriptionCompletion.content;
                }
                
            } catch (error) {
                throw new Error(`Character design failed: ${error.message}`);
            }
        }

        async function generateCharacterImages() {
            try {
                for (const [characterName, characterData] of Object.entries(storyData.characterDescriptions)) {
                    const imagePrompt = `Children's book character illustration: ${characterData.initialDescription}. Simple, clean background. Child-friendly cartoon style, bright and vibrant colors.`;

                    const imageResult = await websim.imageGen({
                        prompt: imagePrompt,
                        aspect_ratio: "1:1"
                    });

                    if (!imageResult || !imageResult.url) {
                        throw new Error(`Failed to generate image for character: ${characterName}`);
                    }

                    characterData.referenceImageUrl = imageResult.url;
                }
                
            } catch (error) {
                throw new Error(`Character image generation failed: ${error.message}`);
            }
        }

        async function analyzeCharacterImages() {
            try {
                for (const [characterName, characterData] of Object.entries(storyData.characterDescriptions)) {
                    const analysisPrompt = `Analyze this character image and provide a detailed visual description that can be used to maintain consistency in future illustrations. Focus on:

- Exact colors used (be specific about shades)
- Body shape and proportions
- Facial features and expressions
- Clothing details and patterns
- Any accessories or distinctive features
- Art style characteristics

Be very detailed and specific so this description can be used to recreate the character consistently.

Respond with just the detailed visual analysis, no other text.`;

                    const analysisCompletion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: analysisPrompt
                                    },
                                    {
                                        type: "image_url",
                                        image_url: { url: characterData.referenceImageUrl }
                                    }
                                ]
                            }
                        ]
                    });

                    characterData.visualAnalysis = analysisCompletion.content;
                }
                
            } catch (error) {
                throw new Error(`Character analysis failed: ${error.message}`);
            }
        }

        async function generateStoryImages() {
            try {
                for (let i = 0; i < storyData.pages.length; i++) {
                    const page = storyData.pages[i];
                    
                    let imagePrompt = `Children's book illustration: ${page.text}`;
                    
                    const pageText = page.text.toLowerCase();
                    for (const [characterName, characterData] of Object.entries(storyData.characterDescriptions)) {
                        if (pageText.includes(characterName.toLowerCase())) {
                            imagePrompt += ` Character "${characterName}" should look exactly like this: ${characterData.visualAnalysis}`;
                        }
                    }
                    
                    imagePrompt += `. Scene should match the story context. Colorful, cheerful, cartoon style suitable for children aged 4-8, bright and vibrant colors, clear composition.`;

                    const imageResult = await websim.imageGen({
                        prompt: imagePrompt,
                        aspect_ratio: "4:3"
                    });

                    if (!imageResult || !imageResult.url) {
                        throw new Error(`Failed to generate illustration for page ${page.pageNumber}`);
                    }

                    page.imageUrl = imageResult.url;
                }
                
            } catch (error) {
                throw new Error(`Story illustration generation failed: ${error.message}`);
            }
        }

        function displayStorybook() {
            document.getElementById('loadingDiv').style.display = 'none';
            
            const storybookDiv = document.getElementById('storybook');
            
            let html = `
                <div class="story-title">${storyData.title}</div>
                <div class="book-container">
                    <div class="book-spine"></div>
                    <div class="book-cover" onclick="openBook()">
                        <div>
                            <div>📖</div>
                            <div style="font-size: 0.6em; margin-top: 10px;">Click to open</div>
                        </div>
                    </div>
                    <div class="book-pages" id="bookPages">
                        <!-- Pages will be inserted here -->
                    </div>
                    <div class="navigation">
                        <button class="nav-button" onclick="previousPage()" id="prevBtn">
                            ← Previous
                        </button>
                        <button class="nav-button" onclick="nextPage()" id="nextBtn">
                            Next →
                        </button>
                        <button class="nav-button" onclick="closeBook()" id="closeBtn">
                            Close Book
                        </button>
                    </div>
                </div>
                <div class="create-another">
                    <button onclick="resetForm()">📚 Create Another Story!</button>
                </div>
            `;

            storybookDiv.innerHTML = html;
            generatePages();
            currentPage = 0;
            bookOpened = false;
            updateNavigation();
        }

        function generatePages() {
            const bookPages = document.getElementById('bookPages');
            let pagesHtml = '';

            for (let i = 0; i < storyData.pages.length; i++) {
                const page = storyData.pages[i];
                pagesHtml += `
                    <div class="page-content" id="page-${i}" style="display: none;">
                        <div class="page-left">
                            <div class="page-text">${page.text}</div>
                            <div class="page-number">${page.pageNumber}</div>
                        </div>
                        <div class="page-right">
                            <div class="page-image">
                                <img src="${page.imageUrl}" alt="Illustration for page ${page.pageNumber}" loading="lazy">
                            </div>
                        </div>
                    </div>
                `;
            }

            bookPages.innerHTML = pagesHtml;
        }

        function openBook() {
            if (!bookOpened) {
                document.querySelector('.book-cover').classList.add('opened');
                document.querySelector('.book-pages').classList.add('active');
                setTimeout(() => {
                    showPage(0);
                }, 300);
                bookOpened = true;
                updateNavigation();
            }
        }

        function closeBook() {
            document.querySelector('.book-cover').classList.remove('opened');
            document.querySelector('.book-pages').classList.remove('active');
            storyData.pages.forEach((_, index) => {
                document.getElementById(`page-${index}`).style.display = 'none';
            });
            bookOpened = false;
            updateNavigation();
        }

        function showPage(pageIndex) {
            storyData.pages.forEach((_, index) => {
                document.getElementById(`page-${index}`).style.display = 'none';
            });

            if (pageIndex >= 0 && pageIndex < storyData.pages.length) {
                const pageElement = document.getElementById(`page-${pageIndex}`);
                pageElement.style.display = 'flex';
                pageElement.classList.add('page-turn-animation');
                
                setTimeout(() => {
                    pageElement.classList.remove('page-turn-animation');
                }, 600);
            }

            currentPage = pageIndex;
            updateNavigation();
        }

        function nextPage() {
            if (currentPage < storyData.pages.length - 1) {
                showPage(currentPage + 1);
            }
        }

        function previousPage() {
            if (currentPage > 0) {
                showPage(currentPage - 1);
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const closeBtn = document.getElementById('closeBtn');

            if (!bookOpened) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                closeBtn.style.display = 'none';
                return;
            }

            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
            closeBtn.style.display = 'flex';

            prevBtn.disabled = currentPage <= 0;
            nextBtn.disabled = currentPage >= storyData.pages.length - 1;
        }

        function showError(message, showRetry = false) {
            const errorDiv = document.getElementById('errorDiv');
            const errorMessage = document.getElementById('errorMessage');
            const retryButton = errorDiv.querySelector('.retry-button');
            
            errorMessage.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('loadingDiv').style.display = 'none';
            
            const actionButtons = errorDiv.querySelector('.error-actions');
            if (showRetry) {
                actionButtons.style.display = 'block';
            } else {
                actionButtons.style.display = 'none';
            }
        }

        function resetForm() {
            document.getElementById('storyForm').style.display = 'block';
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('errorDiv').style.display = 'none';
            document.getElementById('storybook').innerHTML = '';
            
            if (currentGenerationStep === null) {
                document.getElementById('storyTopic').value = '';
                document.getElementById('mainCharacters').value = '';
                document.getElementById('sideCharacters').value = '';
                document.getElementById('pages').value = '5';
            }
            
            currentPage = 0;
            bookOpened = false;
            currentGenerationStep = null;
            generationRetryCount = 0;
            
            document.getElementById('loadingText').textContent = '🌟 Creating your magical story...';
            document.getElementById('loadingSubtext').textContent = 'This may take a few moments while we generate text and illustrations!';
            document.getElementById('retryCount').textContent = '';
        }

        document.addEventListener('keydown', (e) => {
            if (bookOpened) {
                if (e.key === 'ArrowRight') {
                    nextPage();
                } else if (e.key === 'ArrowLeft') {
                    previousPage();
                } else if (e.key === 'Escape') {
                    closeBook();
                }
            }
        });
    </script>
