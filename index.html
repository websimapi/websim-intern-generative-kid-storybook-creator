<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Kid Storybook Creator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turn.js@4.1.0/turn.min.js"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6366f1;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .form-section {
            background: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
            font-size: 1.1em;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #6366f1;
        }

        .storybook {
            margin-top: 30px;
            text-align: center;
        }

        .story-title {
            text-align: center;
            color: #6366f1;
            font-size: 2.2em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .book-container {
            display: inline-block;
            margin: 0 auto;
            position: relative;
        }

        #flipbook {
            width: 800px;
            height: 600px;
            margin: 0 auto;
        }

        .page {
            width: 400px;
            height: 600px;
            background: white;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .book-cover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .book-cover .subtitle {
            font-size: 0.4em;
            margin-top: 20px;
            opacity: 0.9;
        }

        .page-content {
            width: 100%;
            height: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .text-page .page-content {
            background: #fefefe;
        }

        .image-page .page-content {
            background: #f8fafc;
            padding: 20px;
        }

        .page-text {
            font-size: 22px;
            line-height: 1.8;
            color: #374151;
            text-align: center;
            max-width: 300px;
        }

        .page-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-image img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
            object-fit: contain;
        }

        .page-number {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #6366f1;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .back-cover {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
        }

        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #ef4444;
            background: #fef2f2;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #fecaca;
            margin: 15px 0;
        }

        .create-another {
            text-align: center;
            margin-top: 40px;
        }

        /* Turn.js styling */
        .turn-page {
            background-color: white;
            background-size: 100% 100%;
        }

        .turn-page-wrapper {
            perspective: 2000px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            #flipbook {
                width: 600px;
                height: 450px;
            }

            .page {
                width: 300px;
                height: 450px;
            }

            .page-text {
                font-size: 18px;
                max-width: 250px;
            }

            .book-cover {
                font-size: 2em;
            }
        }

        @media (max-width: 600px) {
            #flipbook {
                width: 400px;
                height: 300px;
            }

            .page {
                width: 200px;
                height: 300px;
            }

            .page-content {
                padding: 20px;
            }

            .page-text {
                font-size: 16px;
                max-width: 160px;
            }

            .book-cover {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Magical Storybook Creator 🌟</h1>
        
        <div class="form-section" id="storyForm">
            <div class="form-group">
                <label for="pages">Number of Pages (3-10):</label>
                <select id="pages">
                    <option value="3">3 Pages</option>
                    <option value="4">4 Pages</option>
                    <option value="5" selected>5 Pages</option>
                    <option value="6">6 Pages</option>
                    <option value="7">7 Pages</option>
                    <option value="8">8 Pages</option>
                    <option value="9">9 Pages</option>
                    <option value="10">10 Pages</option>
                </select>
            </div>

            <div class="form-group">
                <label for="storyTopic">What should the story be about?</label>
                <textarea id="storyTopic" placeholder="e.g., A brave little mouse who wants to become a knight, or a magical garden where vegetables come to life..."></textarea>
            </div>

            <div class="form-group">
                <label for="mainCharacters">Main Characters (optional):</label>
                <input type="text" id="mainCharacters" placeholder="e.g., Luna the rabbit, Captain Whiskers...">
            </div>

            <div class="form-group">
                <label for="sideCharacters">Side Characters (optional):</label>
                <input type="text" id="sideCharacters" placeholder="e.g., Old Oak Tree, Sparkle the fairy...">
            </div>

            <button onclick="generateStory()">✨ Create My Story! ✨</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            <div>🌟 Creating your magical story...</div>
            <div style="margin-top: 10px; font-size: 14px;">This may take a few moments while we generate text and illustrations!</div>
        </div>

        <div id="errorDiv" class="error" style="display: none;"></div>

        <div id="storybook" class="storybook"></div>
    </div>

    <script>
        let storyData = {
            pages: [],
            topic: '',
            mainCharacters: '',
            sideCharacters: '',
            totalPages: 0,
            fullStoryContext: ''
        };

        let flipbook;

        async function generateStory() {
            const pages = parseInt(document.getElementById('pages').value);
            const topic = document.getElementById('storyTopic').value.trim();
            const mainCharacters = document.getElementById('mainCharacters').value.trim();
            const sideCharacters = document.getElementById('sideCharacters').value.trim();

            if (!topic) {
                showError('Please tell us what your story should be about!');
                return;
            }

            storyData = {
                pages: [],
                topic,
                mainCharacters,
                sideCharacters,
                totalPages: pages,
                fullStoryContext: ''
            };

            try {
                document.getElementById('storyForm').style.display = 'none';
                document.getElementById('loadingDiv').style.display = 'block';
                document.getElementById('errorDiv').style.display = 'none';

                // Generate the complete story text
                await generateStoryText();
                
                // Generate image descriptions for each page
                await generateImageDescriptions();
                
                // Generate images for each page
                await generateStoryImages();

                // Display the completed storybook
                displayStorybook();

            } catch (error) {
                console.error('Error generating story:', error);
                showError('Oops! Something went wrong while creating your story. Please try again!');
                resetForm();
            }
        }

        async function generateStoryText() {
            const systemPrompt = `You are a creative children's story writer. Create an engaging, age-appropriate story for kids aged 4-8. 
            
            The story should be split into exactly ${storyData.totalPages} pages with clear, simple text suitable for young children.
            
            Story requirements:
            - Topic: ${storyData.topic}
            ${storyData.mainCharacters ? `- Main characters: ${storyData.mainCharacters}` : ''}
            ${storyData.sideCharacters ? `- Side characters: ${storyData.sideCharacters}` : ''}
            - Each page should have 1-3 sentences
            - Use simple, engaging language
            - Include a clear beginning, middle, and end
            - Make it positive and inspiring
            
            Respond with JSON in this exact format:
            {
              "title": "Story Title",
              "pages": [
                {
                  "pageNumber": 1,
                  "text": "Page 1 text here"
                },
                {
                  "pageNumber": 2,
                  "text": "Page 2 text here"
                }
              ]
            }`;

            const completion = await websim.chat.completions.create({
                messages: [
                    {
                        role: "system",
                        content: systemPrompt
                    },
                    {
                        role: "user",
                        content: "Please create my story!"
                    }
                ],
                json: true
            });

            const result = JSON.parse(completion.content);
            storyData.title = result.title;
            storyData.pages = result.pages;
            
            // Create full story context for image generation
            storyData.fullStoryContext = storyData.pages.map(p => `Page ${p.pageNumber}: ${p.text}`).join('\n');
        }

        async function generateImageDescriptions() {
            for (let i = 0; i < storyData.pages.length; i++) {
                const page = storyData.pages[i];
                
                const systemPrompt = `You are an expert at creating detailed visual descriptions for children's book illustrations. 
                
                Given the full story context and a specific page, create a detailed image description that:
                1. Captures the specific scene/action of this page
                2. Maintains visual consistency with the overall story
                3. Is appropriate for children aged 4-8
                4. Describes characters, setting, mood, and actions clearly
                5. Uses colorful, cheerful, cartoon-style imagery
                
                Full Story Context:
                ${storyData.fullStoryContext}
                
                Main Characters: ${storyData.mainCharacters || 'Not specified'}
                Side Characters: ${storyData.sideCharacters || 'Not specified'}
                
                Current Page Text: "${page.text}"
                
                Respond with just the detailed image description (no JSON, just the description text).`;

                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: systemPrompt
                        },
                        {
                            role: "user",
                            content: `Create an image description for page ${page.pageNumber}.`
                        }
                    ]
                });

                page.imageDescription = completion.content;
            }
        }

        async function generateStoryImages() {
            for (let i = 0; i < storyData.pages.length; i++) {
                const page = storyData.pages[i];
                
                // Use the generated image description for better consistency
                let imagePrompt = `Children's book illustration: ${page.imageDescription}. Colorful, cheerful, cartoon style, bright and vibrant colors, simple and clear composition, no text or words in the image.`;

                const imageResult = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "3:4"
                });

                page.imageUrl = imageResult.url;
            }
        }

        function displayStorybook() {
            document.getElementById('loadingDiv').style.display = 'none';
            
            const storybookDiv = document.getElementById('storybook');
            
            let html = `
                <div class="story-title">${storyData.title}</div>
                <div class="book-container">
                    <div id="flipbook"></div>
                </div>
                <div class="navigation">
                    <button class="nav-button" onclick="previousPage()" id="prevBtn">
                        ← Previous Page
                    </button>
                    <button class="nav-button" onclick="nextPage()" id="nextBtn">
                        Next Page →
                    </button>
                    <button class="nav-button" onclick="goToFirstPage()" id="firstBtn">
                        📖 First Page
                    </button>
                </div>
                <div class="create-another">
                    <button onclick="resetForm()">📚 Create Another Story!</button>
                </div>
            `;

            storybookDiv.innerHTML = html;
            
            // Initialize the flipbook after a short delay to ensure DOM is ready
            setTimeout(() => {
                initializeFlipbook();
            }, 100);
        }

        function initializeFlipbook() {
            const flipbookEl = document.getElementById('flipbook');
            
            // Create pages HTML
            let pagesHtml = '';
            
            // Front cover
            pagesHtml += `
                <div class="page">
                    <div class="book-cover">
                        <div>📖</div>
                        <div>${storyData.title}</div>
                        <div class="subtitle">Click to turn pages</div>
                    </div>
                </div>
            `;
            
            // Story pages - each story page gets two physical pages (text on left, image on right)
            for (let i = 0; i < storyData.pages.length; i++) {
                const page = storyData.pages[i];
                
                // Text page (left side)
                pagesHtml += `
                    <div class="page text-page">
                        <div class="page-content">
                            <div class="page-text">${page.text}</div>
                            <div class="page-number">${page.pageNumber}</div>
                        </div>
                    </div>
                `;
                
                // Image page (right side)
                pagesHtml += `
                    <div class="page image-page">
                        <div class="page-content">
                            <div class="page-image">
                                <img src="${page.imageUrl}" alt="Illustration for page ${page.pageNumber}" loading="lazy">
                            </div>
                        </div>
                    </div>
                `;
            }
            
            // Back cover (if odd number of total pages, add a blank page first)
            const totalPages = 1 + (storyData.pages.length * 2);
            if (totalPages % 2 === 0) {
                pagesHtml += `<div class="page"></div>`;
            }
            
            pagesHtml += `
                <div class="page">
                    <div class="back-cover">
                        <div>📚</div>
                        <div>The End</div>
                        <div style="font-size: 0.6em; margin-top: 20px;">Hope you enjoyed the story!</div>
                    </div>
                </div>
            `;
            
            flipbookEl.innerHTML = pagesHtml;
            
            // Initialize turn.js
            $("#flipbook").turn({
                width: 800,
                height: 600,
                autoCenter: true,
                display: 'double',
                acceleration: true,
                gradients: true,
                elevation: 50,
                when: {
                    turned: function(event, page, view) {
                        updateNavigation();
                    }
                }
            });

            flipbook = $("#flipbook").turn('page');
            updateNavigation();
        }

        function nextPage() {
            if (flipbook) {
                $("#flipbook").turn('next');
            }
        }

        function previousPage() {
            if (flipbook) {
                $("#flipbook").turn('previous');
            }
        }

        function goToFirstPage() {
            if (flipbook) {
                $("#flipbook").turn('page', 1);
            }
        }

        function updateNavigation() {
            if (!flipbook) return;
            
            const currentPage = $("#flipbook").turn('page');
            const totalPages = $("#flipbook").turn('pages');
            
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const firstBtn = document.getElementById('firstBtn');
            
            if (prevBtn) prevBtn.disabled = currentPage <= 1;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
            if (firstBtn) firstBtn.disabled = currentPage <= 1;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorDiv');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function resetForm() {
            document.getElementById('storyForm').style.display = 'block';
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('errorDiv').style.display = 'none';
            document.getElementById('storybook').innerHTML = '';
            
            // Reset form fields
            document.getElementById('storyTopic').value = '';
            document.getElementById('mainCharacters').value = '';
            document.getElementById('sideCharacters').value = '';
            document.getElementById('pages').value = '5';
            
            // Reset flipbook
            flipbook = null;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (flipbook) {
                if (e.key === 'ArrowRight') {
                    nextPage();
                } else if (e.key === 'ArrowLeft') {
                    previousPage();
                } else if (e.key === 'Home') {
                    goToFirstPage();
                }
            }
        });
    </script>

</body>
