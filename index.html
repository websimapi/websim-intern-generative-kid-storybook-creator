<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Kid Storybook Creator</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6366f1;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .form-section {
            background: #f8fafc;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 3px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
            font-size: 1.1em;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #6366f1;
        }

        .storybook {
            margin-top: 30px;
            perspective: 1500px;
        }

        .book-container {
            position: relative;
            width: 900px;
            height: 650px;
            margin: 0 auto;
            transform-style: preserve-3d;
        }

        .book-spine {
            position: absolute;
            left: -15px;
            top: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(to bottom, #8b4513, #654321);
            border-radius: 5px 0 0 5px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
        }

        .book-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 0 15px 15px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.6s ease;
            transform-origin: left center;
            backface-visibility: hidden;
            z-index: 10;
        }

        .book-cover.opened {
            transform: rotateY(-180deg);
        }

        .book-pages {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fefefe;
            border-radius: 0 15px 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
        }

        .book-pages.active {
            display: block;
        }

        .page-spread {
            display: flex;
            height: 100%;
            position: relative;
        }

        .page {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: #fefefe;
        }

        .page.left {
            border-right: 2px solid #e2e8f0;
        }

        .page.right {
            position: relative;
            transform-origin: left center;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .page.right.turning {
            transform: rotateY(-180deg);
        }

        .page.text-page {
            justify-content: center;
            align-items: center;
        }

        .page.image-page {
            justify-content: center;
            align-items: center;
        }

        .page-text {
            font-size: 22px;
            line-height: 1.8;
            color: #374151;
            text-align: center;
            margin: 20px 0;
        }

        .page-image {
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-image img {
            max-width: 95%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
            object-fit: contain;
        }

        .page-number {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #6366f1;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .navigation {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .nav-button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #ef4444;
            background: #fef2f2;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #fecaca;
            margin: 15px 0;
        }

        .story-title {
            text-align: center;
            color: #6366f1;
            font-size: 2.2em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .create-another {
            text-align: center;
            margin-top: 30px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .book-container {
                width: 90vw;
                height: 70vh;
                max-width: 600px;
                max-height: 450px;
            }

            .page {
                padding: 20px;
            }

            .page-text {
                font-size: 16px;
            }

            .book-cover {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Magical Storybook Creator 🌟</h1>
        
        <div class="form-section" id="storyForm">
            <div class="form-group">
                <label for="pages">Number of Pages (3-10):</label>
                <select id="pages">
                    <option value="3">3 Pages</option>
                    <option value="4">4 Pages</option>
                    <option value="5" selected>5 Pages</option>
                    <option value="6">6 Pages</option>
                    <option value="7">7 Pages</option>
                    <option value="8">8 Pages</option>
                    <option value="9">9 Pages</option>
                    <option value="10">10 Pages</option>
                </select>
            </div>

            <div class="form-group">
                <label for="storyTopic">What should the story be about?</label>
                <textarea id="storyTopic" placeholder="e.g., A brave little mouse who wants to become a knight, or a magical garden where vegetables come to life..."></textarea>
            </div>

            <div class="form-group">
                <label for="mainCharacters">Main Characters (optional):</label>
                <input type="text" id="mainCharacters" placeholder="e.g., Luna the rabbit, Captain Whiskers...">
            </div>

            <div class="form-group">
                <label for="sideCharacters">Side Characters (optional):</label>
                <input type="text" id="sideCharacters" placeholder="e.g., Old Oak Tree, Sparkle the fairy...">
            </div>

            <button onclick="generateStory()">✨ Create My Story! ✨</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            <div>🌟 Creating your magical story...</div>
            <div style="margin-top: 10px; font-size: 14px;">This may take a few moments while we generate text and illustrations!</div>
        </div>

        <div id="errorDiv" class="error" style="display: none;"></div>

        <div id="storybook" class="storybook"></div>
    </div>

    <script>
        let storyData = {
            pages: [],
            topic: '',
            mainCharacters: '',
            sideCharacters: '',
            totalPages: 0
        };

        let currentPageIndex = 0; 
        let bookOpened = false;
        let isAnimating = false;

        async function generateStory() {
            const pages = parseInt(document.getElementById('pages').value);
            const topic = document.getElementById('storyTopic').value.trim();
            const mainCharacters = document.getElementById('mainCharacters').value.trim();
            const sideCharacters = document.getElementById('sideCharacters').value.trim();

            if (!topic) {
                showError('Please tell us what your story should be about!');
                return;
            }

            storyData = {
                pages: [],
                topic,
                mainCharacters,
                sideCharacters,
                totalPages: pages
            };

            try {
                document.getElementById('storyForm').style.display = 'none';
                document.getElementById('loadingDiv').style.display = 'block';
                document.getElementById('errorDiv').style.display = 'none';

                // Generate the complete story text
                await generateStoryText();
                
                // Generate images for each page
                await generateStoryImages();

                // Display the completed storybook
                displayStorybook();

            } catch (error) {
                console.error('Error generating story:', error);
                showError('Oops! Something went wrong while creating your story. Please try again!');
                resetForm();
            }
        }

        async function generateStoryText() {
            const systemPrompt = `You are a creative children's story writer. Create an engaging, age-appropriate story for kids aged 4-8. 
            
            The story should be split into exactly ${storyData.totalPages} pages with clear, simple text suitable for young children.
            
            Story requirements:
            - Topic: ${storyData.topic}
            ${storyData.mainCharacters ? `- Main characters: ${storyData.mainCharacters}` : ''}
            ${storyData.sideCharacters ? `- Side characters: ${storyData.sideCharacters}` : ''}
            - Each page should have 1-3 sentences
            - Use simple, engaging language
            - Include a clear beginning, middle, and end
            - Make it positive and inspiring
            
            Respond with JSON in this exact format:
            {
              "title": "Story Title",
              "pages": [
                {
                  "pageNumber": 1,
                  "text": "Page 1 text here"
                },
                {
                  "pageNumber": 2,
                  "text": "Page 2 text here"
                }
              ]
            }`;

            const completion = await websim.chat.completions.create({
                messages: [
                    {
                        role: "system",
                        content: systemPrompt
                    },
                    {
                        role: "user",
                        content: "Please create my story!"
                    }
                ],
                json: true
            });

            const result = JSON.parse(completion.content);
            storyData.title = result.title;
            storyData.pages = result.pages;
        }

        async function generateStoryImages() {
            for (let i = 0; i < storyData.pages.length; i++) {
                const page = storyData.pages[i];
                
                // Create a detailed prompt for the image
                let imagePrompt = `Children's book illustration, ${page.text}`;
                
                // Add character information if available
                if (storyData.mainCharacters) {
                    imagePrompt += ` featuring ${storyData.mainCharacters}`;
                }
                
                // Add style information
                imagePrompt += `. Colorful, cheerful, cartoon style, suitable for children aged 4-8, bright and vibrant colors, simple and clear composition.`;

                const imageResult = await websim.imageGen({
                    prompt: imagePrompt,
                    aspect_ratio: "4:3"
                });

                page.imageUrl = imageResult.url;
            }
        }

        function displayStorybook() {
            document.getElementById('loadingDiv').style.display = 'none';
            
            const storybookDiv = document.getElementById('storybook');
            
            let html = `
                <div class="story-title">${storyData.title}</div>
                <div class="book-container">
                    <div class="book-spine"></div>
                    <div class="book-cover" onclick="openBook()">
                        <div>
                            <div>📖</div>
                            <div style="font-size: 0.6em; margin-top: 10px;">Click to open</div>
                        </div>
                    </div>
                    <div class="book-pages" id="bookPages">
                        <!-- Pages will be inserted here -->
                    </div>
                    <div class="navigation">
                        <button class="nav-button" onclick="previousPage()" id="prevBtn">
                            ← Previous
                        </button>
                        <button class="nav-button" onclick="nextPage()" id="nextBtn">
                            Next →
                        </button>
                        <button class="nav-button" onclick="closeBook()" id="closeBtn">
                            Close Book
                        </button>
                    </div>
                </div>
                <div class="create-another">
                    <button onclick="resetForm()">📚 Create Another Story!</button>
                </div>
            `;

            storybookDiv.innerHTML = html;
            generateBookPages();
            currentPageIndex = 0;
            bookOpened = false;
            updateNavigation();
        }

        function generateBookPages() {
            const bookPages = document.getElementById('bookPages');
            let pagesHtml = '';

            // Create individual page spreads - each page gets its own spread with text on left and image on right
            for (let i = 0; i < storyData.pages.length; i++) {
                const page = storyData.pages[i];
                
                pagesHtml += `
                    <div class="page-spread" id="page-${i}" style="display: none;">
                        <div class="page left text-page">
                            <div class="page-text">${page.text}</div>
                            <div class="page-number">${page.pageNumber}</div>
                        </div>
                        <div class="page right image-page" id="right-page-${i}">
                            <div class="page-image">
                                <img src="${page.imageUrl}" alt="Illustration for page ${page.pageNumber}" loading="lazy">
                            </div>
                        </div>
                    </div>
                `;
            }

            // Add a final "The End" page
            pagesHtml += `
                <div class="page-spread" id="page-${storyData.pages.length}" style="display: none;">
                    <div class="page left">
                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 2.5em; color: #6366f1; text-align: center;">
                            <div>
                                <div>🌟</div>
                                <div style="margin-top: 20px;">The End</div>
                                <div style="font-size: 0.4em; margin-top: 15px; color: #8b5cf6;">Thank you for reading!</div>
                            </div>
                        </div>
                    </div>
                    <div class="page right">
                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 4em;">
                            📚✨
                        </div>
                    </div>
                </div>
            `;

            bookPages.innerHTML = pagesHtml;
        }

        function openBook() {
            if (!bookOpened) {
                document.querySelector('.book-cover').classList.add('opened');
                document.querySelector('.book-pages').classList.add('active');
                setTimeout(() => {
                    showPage(0);
                }, 300);
                bookOpened = true;
                updateNavigation();
            }
        }

        function closeBook() {
            document.querySelector('.book-cover').classList.remove('opened');
            document.querySelector('.book-pages').classList.remove('active');
            
            // Hide all pages
            const totalPages = storyData.pages.length + 1; // +1 for "The End" page
            for (let i = 0; i < totalPages; i++) {
                const page = document.getElementById(`page-${i}`);
                if (page) page.style.display = 'none';
            }
            
            bookOpened = false;
            currentPageIndex = 0;
            updateNavigation();
        }

        function showPage(pageIndex) {
            const totalPages = storyData.pages.length + 1; // +1 for "The End" page
            
            // Hide all pages
            for (let i = 0; i < totalPages; i++) {
                const page = document.getElementById(`page-${i}`);
                if (page) page.style.display = 'none';
            }

            // Show the current page
            if (pageIndex >= 0 && pageIndex < totalPages) {
                const page = document.getElementById(`page-${pageIndex}`);
                if (page) {
                    page.style.display = 'flex';
                }
            }

            currentPageIndex = pageIndex;
            updateNavigation();
        }

        function nextPage() {
            if (isAnimating) return;
            
            const totalPages = storyData.pages.length + 1; // +1 for "The End" page
            if (currentPageIndex < totalPages - 1) {
                isAnimating = true;
                
                // Get the current right page and animate it turning
                const currentRightPage = document.getElementById(`right-page-${currentPageIndex}`);
                if (currentRightPage) {
                    currentRightPage.classList.add('turning');
                }
                
                setTimeout(() => {
                    showPage(currentPageIndex + 1);
                    if (currentRightPage) {
                        currentRightPage.classList.remove('turning');
                    }
                    isAnimating = false;
                }, 400);
            }
        }

        function previousPage() {
            if (isAnimating) return;
            
            if (currentPageIndex > 0) {
                isAnimating = true;
                
                // Show the previous page immediately, then animate
                showPage(currentPageIndex - 1);
                
                const newRightPage = document.getElementById(`right-page-${currentPageIndex}`);
                if (newRightPage) {
                    newRightPage.classList.add('turning');
                    setTimeout(() => {
                        newRightPage.classList.remove('turning');
                        isAnimating = false;
                    }, 400);
                } else {
                    isAnimating = false;
                }
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const closeBtn = document.getElementById('closeBtn');

            if (!bookOpened) {
                if (prevBtn) prevBtn.style.display = 'none';
                if (nextBtn) nextBtn.style.display = 'none';
                if (closeBtn) closeBtn.style.display = 'none';
                return;
            }

            if (prevBtn) prevBtn.style.display = 'flex';
            if (nextBtn) nextBtn.style.display = 'flex';
            if (closeBtn) closeBtn.style.display = 'flex';

            const totalPages = storyData.pages.length + 1; // +1 for "The End" page
            if (prevBtn) prevBtn.disabled = currentPageIndex <= 0 || isAnimating;
            if (nextBtn) nextBtn.disabled = currentPageIndex >= totalPages - 1 || isAnimating;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorDiv');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function resetForm() {
            document.getElementById('storyForm').style.display = 'block';
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('errorDiv').style.display = 'none';
            document.getElementById('storybook').innerHTML = '';
            
            // Reset form fields
            document.getElementById('storyTopic').value = '';
            document.getElementById('mainCharacters').value = '';
            document.getElementById('sideCharacters').value = '';
            document.getElementById('pages').value = '5';
            
            // Reset book state
            currentPageIndex = 0;
            bookOpened = false;
            isAnimating = false;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (bookOpened && !isAnimating) {
                if (e.key === 'ArrowRight') {
                    nextPage();
                } else if (e.key === 'ArrowLeft') {
                    previousPage();
                } else if (e.key === 'Escape') {
                    closeBook();
                }
            }
        });
    </script>
